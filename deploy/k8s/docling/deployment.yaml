# Docling：文档解析（11GB 镜像，首次拉取慢；资源给足）。
# 不可用时控制面自动降级为内置解析器（/readyz doc_parse 上报）。
apiVersion: v1
kind: Service
metadata:
  name: docling
  labels: { app: docling }
spec:
  selector: { app: docling }
  ports:
    - name: http
      port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling
  labels: { app: docling }
spec:
  replicas: 1
  selector:
    matchLabels: { app: docling }
  template:
    metadata:
      labels: { app: docling }
    spec:
      containers:
        - name: docling
          image: quay.io/docling-project/docling-serve:v1.35.0
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 120  # 模型权重加载慢
            periodSeconds: 30
          resources:
            requests: { cpu: "2000m", memory: "4Gi" }
            limits: { cpu: "4000m", memory: "8Gi" }

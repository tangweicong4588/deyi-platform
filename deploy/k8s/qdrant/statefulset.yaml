# Qdrant：向量派生索引（可重建；丢了可从 PG + 对象存储重建）
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels: { app: qdrant }
spec:
  selector: { app: qdrant }
  ports:
    - name: http
      port: 6333
      targetPort: 6333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: { app: qdrant }
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.11.0
          ports:
            - containerPort: 6333
          volumeMounts:
            - name: qdrantdata
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet: { path: /healthz, port: 6333 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "4000m", memory: "8Gi" }
  volumeClaimTemplates:
    - metadata:
        name: qdrantdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 20Gi }
